name: Feature request
description: Suggest an improvement for TabPillow
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "When I work with ChatGPT and 30 tabs open, ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI Focus
        - Memory Guard
        - Workspaces
        - Tab suspension
        - Settings
        - Localization
        - Other